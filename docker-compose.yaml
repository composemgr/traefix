# nginx proxy address - http://172.17.0.1:64371

name: traefix
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  proxy:
    image: traefik:latest
    container_name: traefik
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: traefik
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      RFC2136_TSIG_KEY: ${RFC2136_TSIG_KEY:-changeme_tsig_key}
      RFC2136_NAMESERVER: ${RFC2136_NAMESERVER:-127.0.0.1}
      RFC2136_TSIG_SECRET: ${RFC2136_TSIG_SECRET:-changeme_tsig_secret}
      RFC2136_TSIG_ALGORITHM: ${RFC2136_TSIG_ALGORITHM:-hmac-sha256.}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '80']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64371:80'
    volumes:
      - './volumes/config/traefix/acme.json:/acme.json:z'
      - './volumes/config/traefik/config.yml:/config.yml:ro'
      - './volumes/config/traefik/traefik.yml:/traefik.yml:ro'
    networks:
      - traefix-app

networks:
  traefix-app:
    name: traefix-app
    external: false
